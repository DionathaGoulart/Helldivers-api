packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm 11 blocks all others).
allowBuilds:
  esbuild: true
  workerd: true

# Single source of truth for shared dev tool versions (`"<name>": "catalog:"`).
# pnpm's default minimumReleaseAge (24 h) is kept: ranges resolve to the newest
# release older than one day.
catalog:
  # CI gate for `/v1/openapi.json` (plan §8 Phase 6).
  "@apidevtools/swagger-parser": ^12.0.0
  "@biomejs/biome": 2.5.13
  "@types/node": ^24.13.4
  aws4fetch: ^1.0.20
  cheerio: 1.2.0
  # Node types for cheerio helpers; must match the domhandler cheerio resolves.
  domhandler: 5.0.3
  # Bundles the Pages `_worker.js` (arch §8.1); same minor as the one wrangler ships.
  esbuild: ^0.28.2
  hono: ^4.13.8
  robots-parser: 3.0.1
  # Pinned: WebP output bytes (and so image keys) must not change with an update (arch §6.5).
  sharp: 0.35.4
  tsx: ^4.23.13
  typescript: ^7.0.2
  vitest: ^5.0.0
  wrangler: 4.131.2
  zod: ^4.6.5
