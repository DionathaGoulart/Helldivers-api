name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm validate:data packages/schemas/test/dataset
      - run: pnpm validate:data
      # Offline scrape over the saved fixtures into a copy of data/ (arch §11 E2E offline).
      - name: E2E offline scrape
        run: |
          cp -R data "$RUNNER_TEMP/data"
          DATA_DIR="$RUNNER_TEMP/data" pnpm scrape --offline --allow-drop --report "$RUNNER_TEMP/reports"
          pnpm validate:data "$RUNNER_TEMP/data/v1"
      - run: pnpm build

  # The built dist on the real Pages runtime (plan D29): `_headers`, `_redirects`, `_routes.json`,
  # static ETag/304 and the Functions, which `app.request()` tests never exercise.
  smoke-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start wrangler pages dev
        working-directory: apps/api
        run: |
          pnpm exec wrangler pages dev dist --port 8000 > "$RUNNER_TEMP/pages-dev.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/v1/meta.json > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pages-dev.log"
          exit 1
      # GitHub has no B2 read key (arch §12), so images are checked only after deploy.
      - run: pnpm smoke --base http://localhost:8000 --skip-images --wait-seconds 0
      - if: failure()
        run: cat "$RUNNER_TEMP/pages-dev.log"
