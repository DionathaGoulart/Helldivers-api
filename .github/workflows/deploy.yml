name: deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "data/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scrape commit is newer than the SHA that triggered the caller.
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Images are static assets: keys are content hashed, so the cache only ever grows by the new
      # ones and a deploy downloads just those from B2.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images
          key: images-${{ hashFiles('data/v1/reports/images.json') }}
          restore-keys: images-
      - run: pnpm images:pull
        env:
          B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
          B2_READ_APP_KEY: ${{ secrets.B2_READ_APP_KEY }}
      # The build validates data/v1 first (schemas, layout, integrity), asserts the static assets
      # limits and, with REQUIRE_IMAGES, that every live image is in dist.
      - run: pnpm build
        env:
          REQUIRE_IMAGES: "1"
      - name: Deploy the Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: smoke
        run: pnpm smoke --base https://helldivers-api.pages.dev
      # A failed deploy keeps the previous deployment live; the issue says which step broke.
      - name: Alert
        if: failure()
        run: pnpm alert --deploy --failed ${{ steps.smoke.conclusion == 'failure' && 'smoke-failed' || 'deploy-failed' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Close alerts
        if: success()
        run: pnpm alert --deploy
        env:
          GH_TOKEN: ${{ github.token }}
