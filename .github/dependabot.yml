version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types must describe the runtime in .nvmrc; bump the major with Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Every bump touches pnpm-lock.yaml and pnpm-workspace.yaml, so one PR per
      # package conflicts after each merge.
      npm-minor-patch:
        update-types: ["minor", "patch"]
        # Pinned: WebP output bytes must not change unnoticed (arch §6.5).
        exclude-patterns: ["sharp"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
