version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types must describe the runtime in .nvmrc; bump the major with Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must match the domhandler cheerio resolves; bump it together with cheerio.
      - dependency-name: domhandler
    # No `groups`: grouped updates rewrite the root importer's `catalog:`
    # specifier in pnpm-lock.yaml, which fails `pnpm install --frozen-lockfile`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
