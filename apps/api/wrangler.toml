name = "helldivers-api"
# Bundled by `scripts/site/bundle.ts` with the dataset's BuildInfo inlined; uploaded as is.
main = "build/worker.js"
no_bundle = true
# Must not be newer than the workerd bundled with the pinned wrangler.
compatibility_date = "2026-09-11"
# Only the custom domain serves the API: a workers.dev or preview URL would bypass the zone's WAF.
workers_dev = false
preview_urls = false
routes = [{ pattern = "helldivers-api.dionatha.com.br", custom_domain = true }]

# Static files are free and never invoke the Worker; only these paths do (`WORKER_ROUTES` in
# `scripts/site/headers.ts`, checked by test/site.test.ts).
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/v1/query/*", "/v1/search"]

# Per-client limits of the dynamic routes: one binding per tier (`TIERS` in src/spec/access.ts,
# checked by test/access.test.ts). Counted per Cloudflare location, approximate by design; the
# zone's WAF rule stops floods before they reach the Worker.
[[ratelimits]]
name = "RL_ANON"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_ORIGIN"
namespace_id = "7102"
simple = { limit = 10, period = 10 }

[[ratelimits]]
name = "RL_KEY"
namespace_id = "7103"
simple = { limit = 20, period = 10 }

# Revoked API keys, by id (comma-separated). Ids are not secret; a revocation ships with a deploy.
[vars]
REVOKED_KEYS = ""
