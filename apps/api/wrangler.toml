name = "helldivers-api"
pages_build_output_dir = "dist"
# Must not be newer than the workerd bundled with the pinned wrangler.
compatibility_date = "2026-09-11"

# Non-secret image backend settings for `/images/*` (arch §8.1). The read key is a Pages secret
# (`wrangler pages secret put B2_READ_KEY_ID` / `B2_READ_APP_KEY`), `.dev.vars` locally.
[vars]
B2_S3_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_BUCKET = "Helldivers-api"
