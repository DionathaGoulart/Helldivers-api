<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reference · Helldivers 2 Data API</title>
    <meta
      name="description"
      content="Every route of the Helldivers 2 Data API, generated from /v1/openapi.json: lists, items, facets, CSV, query, search and images."
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("hd2api-theme");
        } catch {}
        const preferred = matchMedia("(prefers-color-scheme: light)").matches ? "yellow" : "black";
        document.documentElement.dataset.theme = saved === "yellow" || saved === "black" ? saved : preferred;
      })();
    </script>
    <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/app.js" defer></script>
    <style>
      /* The reference fills the viewport below the site header. */
      .reference {
        min-height: 70vh;
      }
    </style>
  </head>
  <body>
    <a class="icon-btn skip-link" href="#reference">Skip to reference</a>
    <div class="terminal-scanline" aria-hidden="true"></div>

    <header class="screen-pad site-header">
      <p class="screen-kicker"><span class="sigil">&gt;</span> REFERENCE</p>
      <nav class="header-actions" aria-label="Site">
        <a class="icon-btn" href="/">Home</a>
        <a class="icon-btn" href="/docs/" aria-current="page">Reference</a>
        <a class="icon-btn" href="/docs/access">Access</a>
        <a class="icon-btn" href="/docs/errors">Errors</a>
        <a class="icon-btn" href="/examples">Examples</a>
        <a class="icon-btn" href="/new">New</a>
        <a class="icon-btn" href="https://github.com/DionathaGoulart/Helldivers-api">GitHub</a>
        <a class="icon-btn" href="/v1/openapi.json">openapi.json</a>
        <button class="icon-btn" type="button" id="theme-toggle">
          Theme: <span id="theme-name">black</span>
        </button>
      </nav>
    </header>

    <div id="reference" class="reference" tabindex="-1">
      <p class="screen-pad micro terminal-cursor" id="reference-loading">Loading reference</p>
      <div id="scalar"></div>
    </div>

    <!-- Scalar pinned by version and by hash (arch §9); it reads the generated document. -->
    <script
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.69.0/dist/browser/standalone.js"
      integrity="sha384-UL+pt9bcR3hCuzEybA1bAyu6yv9qkzJuYCP5N+HZPOo9ZkUXcMflxqBjC1vfDzfe"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/docs/reference.js" defer></script>
  </body>
</html>
